<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤으로 머리치기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    body.flash {
      background: #fff1f2;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      position: relative;
      overflow: hidden;
    }

    .container.running {
      max-width: 520px;
    }

    .container.beep-active {
      box-shadow:
        0 0 35px rgba(239, 68, 68, 0.35),
        0 20px 45px rgba(15, 23, 42, 0.12);
      border-color: #fca5a5;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
      color: #111827;
    }

    .desc {
      margin: 0 0 24px;
      text-align: center;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    input[type="number"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .volume-value {
      width: 48px;
      text-align: right;
      font-size: 14px;
      color: #4b5563;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #2563eb;
      color: white;
    }

    #runningStopBtn {
      width: 100%;
      margin-top: 18px;
      background: #ef4444;
      color: white;
    }

    .visual-box {
      margin-top: 24px;
      min-height: 250px;
      border-radius: 22px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .running .visual-box {
      margin-top: 0;
      min-height: 360px;
    }

    .main-image {
      width: 100%;
      max-width: 300px;
      max-height: 220px;
      object-fit: contain;
      z-index: 2;
      position: relative;
      border-radius: 18px;
    }

    .running .main-image {
      max-width: 390px;
      max-height: 320px;
    }

    .main-image.beep-img-active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.65));
    }

    .beep-overlay {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.16);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    .beep-overlay.active {
      opacity: 1;
    }

    .wave {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(239, 68, 68, 0.7);
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
      z-index: 3;
    }

    .wave.active {
      animation: wavePulse 0.5s ease-out;
    }

    @keyframes wavePulse {
      0% {
        opacity: 0.95;
        transform: scale(0.4);
      }
      100% {
        opacity: 0;
        transform: scale(2.7);
      }
    }

    .beep-text {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 999px;
      background: #ef4444;
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      z-index: 4;
      pointer-events: none;
    }

    .beep-text.active {
      opacity: 1;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
      text-align: center;
    }

    .setup-view {
      display: block;
    }

    .running-view {
      display: none;
    }

    .container.running .setup-view {
      display: none;
    }

    .container.running .running-view {
      display: block;
    }

    .mode-badge {
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
    }

    .running-info {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .info-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .info-value {
      font-size: 26px;
      color: #111827;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <audio id="sound" src="./Beep.m4a" preload="auto" playsinline></audio>

  <div class="container" id="container">
    <div class="setup-view" id="setupView">
      <h1>랜덤으로 머리치기</h1>

      <p class="desc">
        시작 시간부터 종료 시간까지<br />
        최소~최대 간격 사이에서 랜덤하게 신호가 나옵니다.
      </p>

      <div class="row">
        <div>
          <label for="startSec">시작 시간 (초)</label>
          <input id="startSec" type="number" min="0" step="1" value="5" />
        </div>

        <div>
          <label for="endSec">종료 시간 (초)</label>
          <input id="endSec" type="number" min="1" step="1" value="60" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="minInterval">최소 간격 (초)</label>
          <input id="minInterval" type="number" min="0.1" step="0.1" value="2" />
        </div>

        <div>
          <label for="maxInterval">최대 간격 (초)</label>
          <input id="maxInterval" type="number" min="0.1" step="0.1" value="10" />
        </div>
      </div>

      <label for="volume">볼륨</label>
      <div class="volume-row">
        <input id="volume" type="range" min="0" max="100" step="1" value="100" />
        <div class="volume-value" id="volumeValue">100%</div>
      </div>

      <div class="buttons">
        <button id="startBtn">뽑아 칼</button>
      </div>

      <div class="visual-box">
        <img class="main-image" src="./stand.jpg" alt="stand image" />
      </div>

      <div class="status" id="status">
        대기 중입니다.
      </div>
    </div>

    <div class="running-view" id="runningView">
      <div class="mode-badge" id="modeBadge">랜덤 신호 대기 중</div>

      <div class="visual-box">
        <div class="beep-overlay" id="beepOverlay"></div>
        <div class="wave" id="wave"></div>
        <img id="mainImage" class="main-image" src="./stand.jpg" alt="main image" />
        <div class="beep-text" id="beepText">머리를 쳐!!</div>
      </div>

      <div class="running-info">
        <div class="info-card">
          <div class="info-label">머리치기 횟수</div>
          <div class="info-value" id="runCountText">0번</div>
        </div>

        <div class="info-card">
          <div class="info-label">경과 시간</div>
          <div class="info-value" id="secondsText">0.0초</div>
        </div>
      </div>

      <button id="runningStopBtn">금헌</button>
    </div>
  </div>

  <script>
    const STAND_IMAGE = "./stand.jpg";
    const MOVE_GIF = "./move.gif";

    let startDelayMs = 5000;
    let endDelayMs = 60000;
    let minDelayMs = 2000;
    let maxDelayMs = 10000;

    let startTimerId = null;
    let signalTimerId = null;
    let endTimerId = null;
    let statusInterval = null;
    let effectTimer = null;

    let isRunning = false;
    let beepedCount = 0;
    let startedAt = 0;

    const sound = document.getElementById("sound");
    const container = document.getElementById("container");

    const startBtn = document.getElementById("startBtn");
    const runningStopBtn = document.getElementById("runningStopBtn");

    const statusBox = document.getElementById("status");
    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");

    const mainImage = document.getElementById("mainImage");
    const wave = document.getElementById("wave");
    const beepOverlay = document.getElementById("beepOverlay");
    const beepText = document.getElementById("beepText");

    const runCountText = document.getElementById("runCountText");
    const secondsText = document.getElementById("secondsText");
    const modeBadge = document.getElementById("modeBadge");

    startBtn.addEventListener("click", startRandomBeep);
    runningStopBtn.addEventListener("click", () => stopRandomBeep(true));

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = `${volumeSlider.value}%`;
      sound.volume = Number(volumeSlider.value) / 100;
    });

    function startRandomBeep() {
      stopRandomBeep(false);

      const startSec = Number(document.getElementById("startSec").value);
      const endSec = Number(document.getElementById("endSec").value);
      const minInterval = Number(document.getElementById("minInterval").value);
      const maxInterval = Number(document.getElementById("maxInterval").value);
      const volume = Number(volumeSlider.value);

      if (!validateInputs(startSec, endSec, minInterval, maxInterval, volume)) {
        return;
      }

      startDelayMs = startSec * 1000;
      endDelayMs = endSec * 1000;
      minDelayMs = minInterval * 1000;
      maxDelayMs = maxInterval * 1000;

      isRunning = true;
      beepedCount = 0;
      startedAt = performance.now();

      container.classList.add("running");

      mainImage.src = STAND_IMAGE;
      runCountText.textContent = "0번";
      secondsText.textContent = "0.0초";
      modeBadge.textContent = "랜덤 신호 대기 중";

      sound.volume = Math.min(Math.max(volume / 100, 0), 1);
      sound.muted = false;
      sound.load();

      statusInterval = setInterval(updateRunningView, 100);

      startTimerId = setTimeout(() => {
        if (!isRunning) return;
        modeBadge.textContent = "랜덤 신호 진행 중";
        playSoundAndVisual();
      }, startDelayMs);

      endTimerId = setTimeout(() => {
        if (!isRunning) return;
        finishTimer();
      }, endDelayMs);
    }

    function validateInputs(startSec, endSec, minInterval, maxInterval, volume) {
      if (
        !Number.isFinite(startSec) ||
        !Number.isFinite(endSec) ||
        !Number.isFinite(minInterval) ||
        !Number.isFinite(maxInterval)
      ) {
        alert("값을 올바르게 입력해주세요.");
        return false;
      }

      if (startSec < 0) {
        alert("시작 시간은 0초 이상이어야 합니다.");
        return false;
      }

      if (endSec <= startSec) {
        alert("종료 시간은 시작 시간보다 커야 합니다.");
        return false;
      }

      if (minInterval <= 0 || maxInterval <= 0) {
        alert("간격은 0보다 커야 합니다.");
        return false;
      }

      if (minInterval > maxInterval) {
        alert("최소 간격은 최대 간격보다 클 수 없습니다.");
        return false;
      }

      if (volume < 0 || volume > 100) {
        alert("볼륨은 0부터 100 사이여야 합니다.");
        return false;
      }

      return true;
    }

    function playSoundAndVisual() {
      if (!isRunning) return;

      const elapsedMs = performance.now() - startedAt;

      if (elapsedMs >= endDelayMs) {
        finishTimer();
        return;
      }

      sound.pause();
      sound.currentTime = 0;
      sound.muted = false;
      sound.volume = Math.min(Math.max(Number(volumeSlider.value) / 100, 0), 1);

      const playPromise = sound.play();

      triggerVisualEffect();

      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("소리 재생 실패:", error);
        });
      }

      beepedCount++;
      runCountText.textContent = `${beepedCount}번`;

      const randomInterval = Math.random() * (maxDelayMs - minDelayMs) + minDelayMs;
      const nextTime = elapsedMs + randomInterval;

      if (nextTime < endDelayMs) {
        signalTimerId = setTimeout(() => {
          playSoundAndVisual();
        }, randomInterval);
      }
    }

    function triggerVisualEffect() {
      if (effectTimer) {
        clearTimeout(effectTimer);
        effectTimer = null;
      }

      document.body.classList.remove("flash");
      container.classList.remove("beep-active");
      mainImage.classList.remove("beep-img-active");
      wave.classList.remove("active");
      beepOverlay.classList.remove("active");
      beepText.classList.remove("active");

      void document.body.offsetWidth;

      mainImage.src = `${MOVE_GIF}?t=${Date.now()}`;
      document.body.classList.add("flash");
      container.classList.add("beep-active");
      mainImage.classList.add("beep-img-active");
      wave.classList.add("active");
      beepOverlay.classList.add("active");
      beepText.classList.add("active");

      effectTimer = setTimeout(() => {
        document.body.classList.remove("flash");
        container.classList.remove("beep-active");
        mainImage.classList.remove("beep-img-active");
        wave.classList.remove("active");
        beepOverlay.classList.remove("active");
        beepText.classList.remove("active");
        mainImage.src = STAND_IMAGE;
      }, 1000);
    }

    function updateRunningView() {
      if (!isRunning) return;

      const totalElapsed = (performance.now() - startedAt) / 1000;

      runCountText.textContent = `${beepedCount}번`;
      secondsText.textContent = `${totalElapsed.toFixed(1)}초`;
    }

    function finishTimer() {
      if (!isRunning) return;

      isRunning = false;

      clearAllTimers();

      setTimeout(() => {
        resetToSetupView("꽂아 칼");
      }, 700);
    }

    function stopRandomBeep(showMessage = true) {
      isRunning = false;

      clearAllTimers();

      sound.pause();
      sound.currentTime = 0;
      sound.muted = false;

      document.body.classList.remove("flash");
      container.classList.remove("beep-active");
      mainImage.classList.remove("beep-img-active");
      wave.classList.remove("active");
      beepOverlay.classList.remove("active");
      beepText.classList.remove("active");
      mainImage.src = STAND_IMAGE;

      if (showMessage) {
        resetToSetupView("뽑아칼 했으면 끝까지 하셔야죠.");
      }
    }

    function resetToSetupView(message) {
      container.classList.remove("running");

      mainImage.src = STAND_IMAGE;
      statusBox.innerHTML = message;
    }

    function clearAllTimers() {
      if (startTimerId) {
        clearTimeout(startTimerId);
        startTimerId = null;
      }

      if (signalTimerId) {
        clearTimeout(signalTimerId);
        signalTimerId = null;
      }

      if (endTimerId) {
        clearTimeout(endTimerId);
        endTimerId = null;
      }

      if (statusInterval) {
        clearInterval(statusInterval);
        statusInterval = null;
      }

      if (effectTimer) {
        clearTimeout(effectTimer);
        effectTimer = null;
      }
    }
  </script>
</body>
</html>
