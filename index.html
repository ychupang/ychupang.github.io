<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤으로 머리치기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    body.flash {
      background: #fff1f2;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      position: relative;
      overflow: hidden;
    }

    .container.running {
      max-width: 520px;
    }

    .container.beep-active {
      box-shadow:
        0 0 35px rgba(239, 68, 68, 0.35),
        0 20px 45px rgba(15, 23, 42, 0.12);
      border-color: #fca5a5;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
      color: #111827;
    }

    .desc {
      margin: 0 0 24px;
      text-align: center;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    input[type="number"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #2563eb;
      color: white;
    }

    #runningStopBtn {
      width: 100%;
      margin-top: 18px;
      background: #ef4444;
      color: white;
    }

    .visual-box {
      margin-top: 24px;
      min-height: 250px;
      border-radius: 22px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .running .visual-box {
      margin-top: 0;
      min-height: 360px;
    }

    .main-image {
      width: 100%;
      max-width: 300px;
      max-height: 220px;
      object-fit: contain;
      z-index: 2;
      position: relative;
      border-radius: 18px;
    }

    .running .main-image {
      max-width: 390px;
      max-height: 320px;
    }

    .main-image.beep-img-active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.65));
    }

    .beep-overlay {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.16);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    .beep-overlay.active {
      opacity: 1;
    }

    .wave {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(239, 68, 68, 0.7);
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
      z-index: 3;
    }

    .wave.active {
      animation: wavePulse 0.5s ease-out;
    }

    @keyframes wavePulse {
      0% {
        opacity: 0.95;
        transform: scale(0.4);
      }
      100% {
        opacity: 0;
        transform: scale(2.7);
      }
    }

    .beep-text {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 999px;
      background: #ef4444;
      color: white;
      font-size: 14px;
      font-weight: bold;
      opacity: 0;
      z-index: 4;
      pointer-events: none;
    }

    .beep-text.active {
      opacity: 1;
    }

    .setup-view {
      display: block;
    }

    .running-view {
      display: none;
    }

    .container.running .setup-view {
      display: none;
    }

    .container.running .running-view {
      display: block;
    }

    .running-info {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .info-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .info-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .info-value {
      font-size: 22px;
      color: #111827;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div class="container" id="container">
    <div class="setup-view" id="setupView">
      <h1>랜덤으로 머리치기</h1>

      <p class="desc">
        ⚔️ ⚔️ ⚔️ ⚔️<br />
      </p>

      <div class="row">
        <div>
          <label for="startSec">시작 시간 (초)</label>
          <input id="startSec" type="number" min="0" step="1" value="5" />
        </div>

        <div>
          <label for="endSec">종료 시간 (초)</label>
          <input id="endSec" type="number" min="1" step="1" value="65" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="minInterval">최소 간격 (초)</label>
          <input id="minInterval" type="number" min="0.1" step="0.1" value="2" />
        </div>

        <div>
          <label for="maxInterval">최대 간격 (초)</label>
          <input id="maxInterval" type="number" min="0.1" step="0.1" value="10" />
        </div>
      </div>

      <div class="buttons">
        <button id="startBtn">뽑아 칼</button>
      </div>

      <div class="visual-box">
        <img class="main-image" id="setupImage" src="./stand.jpg" alt="stand image" />
      </div>
    </div>

    <div class="running-view" id="runningView">
      <div class="visual-box">
        <div class="beep-overlay" id="beepOverlay"></div>
        <div class="wave" id="wave"></div>
        <img id="mainImage" class="main-image" src="./stand.jpg" alt="main image" />
        <div class="beep-text" id="beepText">머리를 쳐!!</div>
      </div>

      <div class="running-info">
        <div class="info-card">
          <div class="info-label">머리치기 횟수</div>
          <div class="info-value" id="runCountText">0번</div>
        </div>

        <div class="info-card">
          <div class="info-label">경과 시간</div>
          <div class="info-value" id="secondsText">0.0초</div>
        </div>

        <div class="info-card">
          <div class="info-label">소모 칼로리</div>
          <div class="info-value" id="caloriesText">0.00 kcal</div>
        </div>
      </div>

      <button id="runningStopBtn">금헌</button>
    </div>
  </div>

  <script>
    const STAND_IMAGE = "./stand.jpg";
    const PIG_IMAGE = "./pig.jpg";
    const FIRE_IMAGE = "./fire.jpg";
    const MOVE_GIF = "./move.gif";
    const SOUND_URL = "./Beep.m4a";
    const CALORIE_PER_HIT = 2;
    const CALORIE_PER_SECOND = 0.05;

    /* 총 칼로리 = 머리치기 횟수 × 0.25 + 경과 시간(초) × 0.01 */
    function computeCalories() {
      const elapsedSec = (performance.now() - startedAt) / 1000;
      return beepedCount * CALORIE_PER_HIT + elapsedSec * CALORIE_PER_SECOND;
    }

    /* 설정 화면 미리보기용: 1분 미만 pig / 1~5분 stand / 5분 이상 fire */
    function pickBaseImage(totalSec) {
      if (totalSec < 60) return PIG_IMAGE;
      if (totalSec < 300) return STAND_IMAGE;
      return FIRE_IMAGE;
    }

    let startDelayMs = 5000;
    let endDelayMs = 60000;
    let minDelayMs = 2000;
    let maxDelayMs = 10000;

    let startTimerId = null;
    let signalTimerId = null;
    let endTimerId = null;
    let statusInterval = null;
    let effectTimer = null;

    let isRunning = false;
    let beepedCount = 0;
    let startedAt = 0;

    /* ===== Web Audio API ===== */
    let audioCtx = null;       // AudioContext (사용자 클릭 시 생성)
    let audioBuffer = null;    // 디코딩된 사운드
    let rawArrayBuffer = null; // 미리 받아둔 파일 바이트

    const container = document.getElementById("container");

    const startBtn = document.getElementById("startBtn");
    const runningStopBtn = document.getElementById("runningStopBtn");

    const mainImage = document.getElementById("mainImage");
    const wave = document.getElementById("wave");
    const beepOverlay = document.getElementById("beepOverlay");
    const beepText = document.getElementById("beepText");

    const runCountText = document.getElementById("runCountText");
    const secondsText = document.getElementById("secondsText");
    const caloriesText = document.getElementById("caloriesText");

    const setupImage = document.getElementById("setupImage");
    const startSecInput = document.getElementById("startSec");
    const endSecInput = document.getElementById("endSec");

    /* 설정 화면 미리보기: 총 시간(종료 - 시작)에 따라 그림 즉시 갱신 */
    function updateSetupPreview() {
      const startSec = Number(startSecInput.value);
      const endSec = Number(endSecInput.value);
      const totalSec = endSec - startSec;
      if (Number.isFinite(totalSec) && totalSec > 0) {
        setupImage.src = pickBaseImage(totalSec);
      }
    }

    startSecInput.addEventListener("input", updateSetupPreview);
    endSecInput.addEventListener("input", updateSetupPreview);
    updateSetupPreview();

    startBtn.addEventListener("click", startRandomBeep);
    runningStopBtn.addEventListener("click", () => stopRandomBeep(true));

    /* 페이지 로드 시 사운드 파일 바이트만 미리 받아둠 (디코딩은 클릭 후) */
    prefetchAudioFile();

    /* 이미지도 미리 받아 캐시에 올려둠 → 새로고침 없이 즉시 전환 */
    preloadImages();

    function preloadImages() {
      [STAND_IMAGE, PIG_IMAGE, FIRE_IMAGE, MOVE_GIF].forEach((src) => {
        const img = new Image();
        img.src = src;
      });
    }

    async function prefetchAudioFile() {
      try {
        const res = await fetch(SOUND_URL);
        rawArrayBuffer = await res.arrayBuffer();
      } catch (e) {
        console.error("오디오 파일 다운로드 실패:", e);
        rawArrayBuffer = null;
      }
    }

    /* decodeAudioData를 콜백/프로미스 양쪽 모두 지원하는 형태로 래핑 (구형 iOS 대응) */
    function decodeAudioDataCompat(ctx, arrayBuffer) {
      return new Promise((resolve, reject) => {
        ctx.decodeAudioData(arrayBuffer, resolve, reject);
      });
    }

    /*
      사용자 클릭(제스처) 안에서 호출.
      - AudioContext를 제스처 안에서 생성 → iOS에서 가장 견고
      - resume()으로 잠금 해제
      - 무음 버퍼를 한 번 재생해 iOS 오디오 잠금 완전 해제 (소리 안 남)
      - 사운드 디코딩
      반환값: 실제로 재생 준비(디코딩 성공)가 됐는지 true/false
    */
    async function unlockAudio() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }

        if (audioCtx.state === "suspended") {
          try { await audioCtx.resume(); } catch (e) {}
        }

        /* 무음 버퍼 재생: iOS 잠금 해제 트릭 (소리 안 들림) */
        try {
          const silent = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = silent;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (e) {}

        /* 아직 디코딩 안 했으면 지금 디코딩 */
        if (!audioBuffer) {
          if (!rawArrayBuffer) {
            /* 혹시 프리페치가 실패했으면 한 번 더 시도 */
            await prefetchAudioFile();
          }
          if (rawArrayBuffer) {
            /* decodeAudioData가 버퍼를 detach하므로 복사본 사용 */
            const copy = rawArrayBuffer.slice(0);
            audioBuffer = await decodeAudioDataCompat(audioCtx, copy);
          }
        }

        return !!audioBuffer;
      } catch (error) {
        console.error("오디오 잠금 해제 실패:", error);
        return !!audioBuffer;
      }
    }

    /* 실제 비프음 재생: 매번 새 BufferSource 생성 */
    function playBeep() {
      if (!audioCtx || !audioBuffer) return;

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    async function startRandomBeep() {
      stopRandomBeep(false);

      const startSec = Number(document.getElementById("startSec").value);
      const endSec = Number(document.getElementById("endSec").value);
      const minInterval = Number(document.getElementById("minInterval").value);
      const maxInterval = Number(document.getElementById("maxInterval").value);

      if (!validateInputs(startSec, endSec, minInterval, maxInterval)) {
        return;
      }

      startDelayMs = startSec * 1000;
      endDelayMs = endSec * 1000;
      minDelayMs = minInterval * 1000;
      maxDelayMs = maxInterval * 1000;

      const audioReady = await unlockAudio();

      if (!audioReady) {
        alert(
          "Beep.m4a 파일을 불러올 수 없습니다.\n\n" +
          "index.html과 Beep.m4a가 같은 폴더에 있는지 확인해주세요.\n" +
          "(로컬에서 파일을 직접 열면 동작하지 않습니다. github.io 같은 웹 주소로 접속해야 합니다.)"
        );
        return;
      }

      isRunning = true;
      beepedCount = 0;
      startedAt = performance.now();

      container.classList.add("running");

      mainImage.src = STAND_IMAGE;
      runCountText.textContent = "0번";
      secondsText.textContent = "0.0초";
      caloriesText.textContent = "0.00 kcal";

      statusInterval = setInterval(updateRunningView, 100);

      startTimerId = setTimeout(() => {
        if (!isRunning) return;
        playSoundAndVisual();
      }, startDelayMs);

      endTimerId = setTimeout(() => {
        if (!isRunning) return;
        finishTimer();
      }, endDelayMs);
    }

    function validateInputs(startSec, endSec, minInterval, maxInterval) {
      if (
        !Number.isFinite(startSec) ||
        !Number.isFinite(endSec) ||
        !Number.isFinite(minInterval) ||
        !Number.isFinite(maxInterval)
      ) {
        alert("값을 올바르게 입력해주세요.");
        return false;
      }

      if (startSec < 0) {
        alert("시작 시간은 0초 이상이어야 합니다.");
        return false;
      }

      if (endSec <= startSec) {
        alert("종료 시간은 시작 시간보다 커야 합니다.");
        return false;
      }

      if (minInterval <= 0 || maxInterval <= 0) {
        alert("간격은 0보다 커야 합니다.");
        return false;
      }

      if (minInterval > maxInterval) {
        alert("최소 간격은 최대 간격보다 클 수 없습니다.");
        return false;
      }

      return true;
    }

    function playSoundAndVisual() {
      if (!isRunning) return;

      const elapsedMs = performance.now() - startedAt;

      if (elapsedMs >= endDelayMs) {
        finishTimer();
        return;
      }

      playBeep();

      triggerVisualEffect();

      beepedCount++;
      runCountText.textContent = `${beepedCount}번`;
      caloriesText.textContent = `${computeCalories().toFixed(2)} kcal`;

      const randomInterval = Math.random() * (maxDelayMs - minDelayMs) + minDelayMs;
      const nextTime = elapsedMs + randomInterval;

      if (nextTime < endDelayMs) {
        signalTimerId = setTimeout(() => {
          playSoundAndVisual();
        }, randomInterval);
      }
    }

    function triggerVisualEffect() {
      if (effectTimer) {
        clearTimeout(effectTimer);
        effectTimer = null;
      }

      document.body.classList.remove("flash");
      container.classList.remove("beep-active");
      mainImage.classList.remove("beep-img-active");
      wave.classList.remove("active");
      beepOverlay.classList.remove("active");
      beepText.classList.remove("active");

      void document.body.offsetWidth;

      mainImage.src = `${MOVE_GIF}?t=${Date.now()}`;
      document.body.classList.add("flash");
      container.classList.add("beep-active");
      mainImage.classList.add("beep-img-active");
      wave.classList.add("active");
      beepOverlay.classList.add("active");
      beepText.classList.add("active");

      effectTimer = setTimeout(() => {
        document.body.classList.remove("flash");
        container.classList.remove("beep-active");
        mainImage.classList.remove("beep-img-active");
        wave.classList.remove("active");
        beepOverlay.classList.remove("active");
        beepText.classList.remove("active");
        mainImage.src = STAND_IMAGE;
      }, 1000);
    }

    function updateRunningView() {
      if (!isRunning) return;

      const totalElapsed = (performance.now() - startedAt) / 1000;

      runCountText.textContent = `${beepedCount}번`;
      secondsText.textContent = `${totalElapsed.toFixed(1)}초`;
      caloriesText.textContent = `${computeCalories().toFixed(2)} kcal`;
    }

    function finishTimer() {
      if (!isRunning) return;

      isRunning = false;

      clearAllTimers();

      setTimeout(() => {
        resetToSetupView("꽂아 칼");
      }, 700);
    }

    function stopRandomBeep(showMessage = true) {
      isRunning = false;

      clearAllTimers();

      document.body.classList.remove("flash");
      container.classList.remove("beep-active");
      mainImage.classList.remove("beep-img-active");
      wave.classList.remove("active");
      beepOverlay.classList.remove("active");
      beepText.classList.remove("active");
      mainImage.src = STAND_IMAGE;

      if (showMessage) {
        resetToSetupView("뽑아칼 했으면 끝까지 하셔야죠.");
      }
    }

    function resetToSetupView(message) {
      container.classList.remove("running");

      mainImage.src = STAND_IMAGE;
    }

    function clearAllTimers() {
      if (startTimerId) {
        clearTimeout(startTimerId);
        startTimerId = null;
      }

      if (signalTimerId) {
        clearTimeout(signalTimerId);
        signalTimerId = null;
      }

      if (endTimerId) {
        clearTimeout(endTimerId);
        endTimerId = null;
      }

      if (statusInterval) {
        clearInterval(statusInterval);
        statusInterval = null;
      }

      if (effectTimer) {
        clearTimeout(effectTimer);
        effectTimer = null;
      }
    }
  </script>
</body>
</html>
